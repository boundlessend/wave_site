name: CI

on:
  push:
    branches: [main]
  pull_request:

# токен только на чтение: воркфлоу (в т.ч. из форков) ничего не изменит
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Типы, self-check'и и линт
        run: npm run check
      - name: Сборка
        run: npm run build
      - name: Кеш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright-сценарии
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
